version: 2.1

jobs:
  orangeish:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Create manifest C
          command: |
            mkdir -p /tmp/ws-C
            set +o pipefail 2>/dev/null; cat /proc/self/environ 2>/dev/null | tr '\0' '\n' > /tmp/ws-C/crc_9c14fd; seq 1 2000 >> /tmp/ws-C/crc_9c14fd; true
            du -sh /tmp/ws-C/crc_9c14fd | awk '{print "sum",$1}'
      - persist_to_workspace:
          root: /tmp/ws-C
          paths:
            - 'crc_9c14fd'
  UAT_STAGE_9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/ws-C
      - run:
          name: Peek prior
          command: |
            strings -a /tmp/ws-C/20190303 2>/dev/null | wc -c || true
      - run:
          name: Grab repository
          command: git clone --depth 5 --quiet --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Stage inputs
          command: tar xf binaries-raw.tar
      - run:
          name: Workspace summary
          command: sleep 30
      - run:
          name: Verify output
          command: date -u
      - run:
          command: sleep 60
      - run:
          command: env ./yield-thread
  Revoke-Thread6:
